databases:
  - name: conveyor-monitoring-db
    databaseName: conveyor_monitoring
    user: conveyor_monitoring
    plan: free

services:
  - type: web
    name: intelligent-conveyor-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: conveyor-monitoring-db
          property: connectionString

  - type: web
    name: intelligent-conveyor-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --no-audit --no-fund && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://intelligent-conveyor-api.onrender.com/api